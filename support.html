<body>
    <div class="contact">
    <body>
    <h1>Contact</h1>
    <form method="get">
        E-mail: <input type="text" name="email" id="email" required>
        <br>
        <br>
        First Name: <input type="text" name="fname" id="fname" required>
        <br>
        <br>
        Last Name: <input type="text" name="lname" id="lname" required>
        <br>
        <br>
        <label for="Who">Who Do You Want To Contact: </label>
        <select id="who_contact" name="Who_contact" required>
            <option value="">--Please choose who to contact--</option>
            <option value="Us">Us</option>
            <option value="Cherry">Team Cherry</option>
            <option value="Thunk">LocalThunk</option>
            <option value="Giant">SuperGiant</option>
            <option value="Hello">Hello Games</option>
            <option value="Crit">MegaCrit</option>
        </select>
        <br>
        <br>
        <label for="Why">What are you contacting for: </label>
        <select id="why_contact" name="why_contact" required>
            <option value="">--Please choose an reason--</option>
            <option value="Web_issue">Issue With Our Website</option>
            <option value="Beta">Beta Testing</option>
            <option value="Other">Other</option>
        </select>
        <br>
        <br>
        Comments:<br>
        <textarea name="comments" id="comments" rows="4" cols="40" required></textarea>
        <br>
        <br>
        <input type="submit" value="Contact">
        <input type="reset" value="Clear">
    </form>
    <nav class="social_links">
        <ul>
            <li><a href="mailto:Levelupgames@gmail.com">Email</a></li>
            <li><a href="https://x.com/home?lang=en">Twitter / X</a></li>
            <li><a href="https://www.instagram.com/">Instagram</a></li>
        </ul>
    </nav>
</body>
