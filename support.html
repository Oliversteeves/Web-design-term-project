<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up Games</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<header>
    <h1><a href="index.html"><img src="images/templogo.png" alt="templogo"></a></h1>
</header>
<body>
    <div class="columns layout">
        <aside class="column is-3">
            <div class="side-nav">
                <h2 class="title is-4">Game List</h2>
                <ul class="nav_stuff">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="games.html">Games</a></li>
                    <li><a href="about_us.html">About Us</a></li>
                    <li><a href="support.html">Support</a></li>
                </ul>
            </div>
        </aside>
    <main class="column is-9">
        <div class="wrapper">
        <div class="contact">
        <body>
        <h1>Contact</h1>
        <form method="get">
            <div class="field"><label class="label" for="email">Email</label>
            <div class="control"><input id="email" class="input" type="email" placeholder="you@example.com"></div>
            </div>
            
            First Name: <input type="text" name="fname" id="fname" required>
            <br>
            <br>
            Last Name: <input type="text" name="lname" id="lname" required>
            <br>
            <br>
            <label for="Who">Who Do You Want To Contact: </label>
            <select id="who_contact" name="Who_contact" required>
                <option value="">--Please choose who to contact--</option>
                <option value="Us">Us</option>
                <option value="Cherry">Team Cherry</option>
                <option value="Thunk">LocalThunk</option>
                <option value="Giant">SuperGiant</option>
                <option value="Hello">Hello Games</option>
                <option value="Crit">MegaCrit</option>
            </select>
            <br>
            <br>
            <label for="Why">What are you contacting for: </label>
            <select id="why_contact" name="why_contact" required>
                <option value="">--Please choose an reason--</option>
                <option value="Web_issue">Issue With Our Website</option>
                <option value="Beta">Beta Testing</option>
                <option value="Other">Other</option>
            </select>
            <br>
            <br>
            Comments:<br>
            <textarea name="comments" id="comments" rows="4" cols="40" required></textarea>
            <br>
            <br>
            <input type="submit" value="Contact">
            <input type="reset" value="Clear">
        </form>
        <div class="gamebox">
            <nav class="social_links">
                <div class="DisplayBack">
                    <h1>Social Media Links:</h1>
                    <ul>
                        <li><a href="mailto:Levelupgames@gmail.com">Email</a></li>
                        <li><a href="https://x.com/home?lang=en">Twitter / X</a></li>
                        <li><a href="https://www.instagram.com/">Instagram</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </main>
</body>
</div>

</footer>
